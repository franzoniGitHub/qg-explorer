<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QG explorer · two-layer storm track</title>
  <meta name="description" content="Interactive analysis of a two-layer quasi-geostrophic model: fields, waves, statistics, energetics, predictability and observing-system experiments.">

  <script src="lib/plotly.min.js"></script>

<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 28" width="38" height="26" aria-hidden="true">
        <path d="M1 9 C 7 1, 13 1, 20 9 S 33 17, 39 9" fill="none" stroke="var(--upper)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M1 20 C 7 12, 13 12, 20 20 S 33 28, 39 20" fill="none" stroke="var(--lower)" stroke-width="2.4" stroke-linecap="round" transform="translate(-3 -1)"/>
      </svg>
      <div>
        <h1>QG explorer</h1>
        <p id="dataset-title">two-layer quasi-geostrophic storm track</p>
      </div>
    </div>
    <div class="dataset-bar">
      <label class="inline">Dataset

      </label>
      <label class="btn" for="folder-input" title="Load a dataset written by python -m qg2l run">Open a folder…</label>
      <input type="file" id="folder-input" webkitdirectory multiple hidden>
      <button class="btn icon" id="theme-toggle" type="button" aria-label="Switch between light and dark colours" title="Light / dark">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 2a8 8 0 1 0 0 16V2z" fill="currentColor"/><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>

    <div class="loading-box"><div class="loading-text" id="loading-text">Loading…</div><div class="bar"><div id="loading-bar"></div></div></div>
  </div>
  <script type="module" src="js/main.js"></script>
